    <script>
      // Fix environments where window.fetch has only a getter
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return protoFetch;
                },
                set: function(val) {
                  protoFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }
      })();
    </script>
